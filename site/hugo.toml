baseURL = 'https://getkontana.com/'
title = 'Kontana'
theme = 'terminal'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
[pagination]
  pagerSize = 5
[params]
  appVersion = "0.1.5"
  sourceRepository = "https://github.com/plasticrutherfordium/getkontana"
  license = "MPL-2.0"
  description = "Free core. Forever. Open source under MPL-2.0. Optional paid extras."
[languages.en]
  label = "English"
  locale = "en-US"
  weight = 1
[languages.es]
  label = "Español"
  locale = "es-ES"
  weight = 2
[languages.es.params]
  description = "App principal gratis, para siempre. Código abierto bajo MPL-2.0. Extras de pago opcionales."
