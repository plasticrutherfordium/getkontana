{{/* SPDX-License-Identifier: MPL-2.0 */}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="{{ .Description | default .Site.Params.description }}">
<meta name="theme-color" content="#0A100D">
<meta name="kontana-app-version" content="{{ .Site.Params.appVersion }}">
<meta name="kontana-build-timestamp" content="{{ now.UTC.Format "2006-01-02T15:04:05Z07:00" }}">
<meta name="kontana-source" content="{{ .Site.Params.sourceRepository }}">
<meta name="kontana-license" content="{{ .Site.Params.license }}">
<link rel="license" href="/licenses/MPL-2.0.txt">
<link rel="canonical" href="{{ .Permalink }}">
{{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">{{ end }}
<link rel="icon" type="image/png" href="/favicon-kontana3.png">
<link rel="apple-touch-icon" href="/favicon-kontana3.png">
<meta property="og:title" content="{{ if .IsHome }}Kontana — {{ .Title }}{{ else }}{{ .Title }} · Kontana{{ end }}">
<meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
<meta property="og:locale" content="{{ .Language.Lang }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<script>
(function () {
  var theme = 'dark';
  try { theme = localStorage.getItem('kt-theme') || localStorage.getItem('theme') || theme; } catch (_) {}
  window.__ktSetTheme = function (value) {
    var next = value === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    document.documentElement.style.colorScheme = next;
    document.querySelector('meta[name="theme-color"]').content = next === 'light' ? '#F3F5EC' : '#0A100D';
    try { localStorage.setItem('kt-theme', next); localStorage.setItem('theme', next); } catch (_) {}
    window.dispatchEvent(new CustomEvent('kontana:theme', { detail: next }));
  };
  window.__ktToggleTheme = function () { window.__ktSetTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); };
  window.__ktSetTheme(theme);
}());
</script>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/kt-terminal.css">
{{ if eq .Layout "app" }}
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/app-phosphor.css">
<link rel="manifest" href="/manifest.webmanifest">
{{ else }}
<link rel="stylesheet" href="/landing.css">
<script src="/site.js" defer></script>
{{ end }}
